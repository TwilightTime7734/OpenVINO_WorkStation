name: Apply local server root fix

on:
  push:
    branches:
      - fix/qwen35-vlm-compat
    paths:
      - .github/workflows/apply-local-server-root-fix.yml

permissions:
  contents: write

jobs:
  apply-root-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/qwen35-vlm-compat
          fetch-depth: 0

      - name: Apply Form1 source fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .maintenance/root-form1-fix.patch
          git apply .maintenance/root-form1-fix.patch
          git rm Form1.LocalServerOpenAI.cs
          git rm .maintenance/root-form1-fix.patch

      - name: Commit root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Form1.cs
          git commit -m "Fix local server at source"
          git push origin HEAD:fix/qwen35-vlm-compat
